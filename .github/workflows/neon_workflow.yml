name: Neon preview branches

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  branch:
    # Never make project credentials available to fork pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Report optional setup
        if: env.NEON_API_KEY == ''
        run: echo 'Neon branch automation skipped. Configure the NEON_API_KEY repository secret to enable it.'
      - name: Create preview branch
        if: env.NEON_API_KEY != '' && github.event.action != 'closed'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: shiny-pine-10318126
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Remove preview branch after closing the PR
        if: env.NEON_API_KEY != '' && github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: shiny-pine-10318126
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
