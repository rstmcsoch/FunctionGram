name: Build FunctionGram APK

on:
  push:
    branches: [arena/01a0ecce-functiongram, main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK (Universal - all ABIs, all DPIs)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace || echo "Release build needs signing config"
          ls -lh app/build/outputs/apk/release/ || true

      - name: Rename APK to FunctionGram.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FunctionGram.apk || true
          cp android/app/build/outputs/apk/debug/app-debug.apk FunctionGram.apk || true
          ls -lh *.apk android/app/build/outputs/apk/debug/*.apk || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FunctionGram-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FunctionGram.apk
            FunctionGram.apk
          retention-days: 30

      - name: Upload Release APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FunctionGram-release-APK
          path: android/app/build/outputs/apk/release/
          retention-days: 30
          if-no-files-found: ignore
